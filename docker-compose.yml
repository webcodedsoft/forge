services:
  postgres:
    image: postgres:18-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - forge-pg:/var/lib/postgresql

volumes:
  forge-pg:
