packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # Optional native SSH helpers pulled in by dockerode (Forge talks to the local
  # Docker socket, not SSH), and protobufjs's post-install notice: not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.21'
  - '@better-auth/drizzle-adapter@1.7.21'
  - '@better-auth/kysely-adapter@1.7.21'
  - '@better-auth/memory-adapter@1.7.21'
  - '@better-auth/mongo-adapter@1.7.21'
  - '@better-auth/prisma-adapter@1.7.21'
  - '@better-auth/telemetry@1.7.21'
  - '@hono/node-server@2.1.7'
  - better-auth@1.7.21
  - hono@4.13.18
  - postgres@4.1.1
